# Docker Compose for freecad-bridge (FreeCAD headless + Robust MCP Bridge)
#
# Build, run, and push use the same image tag from deploy/.env:
#   cp deploy/.env.example deploy/.env
#   just docker::compose-build
#   just docker::compose-up
#   just docker::publish-dev
#
# XML-RPC bridge listens on :9875 inside the compose network (not published to host).
# Downstream MCP servers connect via service name `freecad` on the same network.
#
# Stop: docker compose -f deploy/docker-compose.yml down

services:
  freecad:
    image: ${FREECAD_BRIDGE_IMAGE:?Set FREECAD_BRIDGE_IMAGE in deploy/.env}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-hub.designorder.cn/}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com/ubuntu/}
        FREECAD_TAG: ${FREECAD_TAG:-1.1.1}
    volumes:
      - assembly-data:/app/sessions
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-sf"
        - "-X"
        - "POST"
        - "-H"
        - "Content-Type: text/xml"
        - "-d"
        - "<?xml version='1.0'?><methodCall><methodName>system.listMethods</methodName></methodCall>"
        - "--max-time"
        - "5"
        - "http://localhost:9875"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

volumes:
  assembly-data:
